name: Build and Publish Docker image

on:
  workflow_dispatch:

  push:
    branches: [ master ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against the GitHub Container Registry
      # https://github.com/docker/login-action
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Get version of qemu-ga in built container (amd64 build for tag detection)
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:getversion

      # Get version of qemu-ga in built container
      - name: Get qemu-ga version
        run: |
          QEMU_GA_VERSION="$(docker run --rm --entrypoint /bin/sh \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:getversion \
            -c 'qemu-ga --version | sed -E "s/[^0-9.]*([0-9.]+)$/\1/"')"
          echo "QEMU_GA_VERSION=${QEMU_GA_VERSION}" >> "$GITHUB_ENV"

      - name: Docker meta tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.QEMU_GA_VERSION }}
            type=semver,pattern={{version}}
          flavor: |
            latest=true

      # Build and push image using qemu-ga version as tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
